<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="icon" href="../MEDIA/tw.png">
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="stylesheet" href="../CSS/login_style.css">
</head>

<body>
  <div class="login-container">
    <div class="login-image">
      <div class="seal-photo brackets">
        <span class="duo">
          <img src="../MEDIA/tw.png" alt="Imagine login cu foci">
        </span>
      </div>
      <span class="cross"></span>
      <div class="barcode"></div>
    </div>

    <div class="separator"></div>

    <form class="login-form" id="loginForm" novalidate>
      <h1 class="title">Log<span class="outline">in</span></h1>
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Parola">
      <button type="submit">Login</button>
      <p class="register-text">
        Nu ai cont? <a href="register.html">Înregistrează-te</a>
      </p>
    </form>
  </div>

  <script src="../JS/login_js.js"></script>
</body>

</html>
